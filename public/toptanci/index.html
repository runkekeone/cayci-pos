<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>babu.co — İşletme Paneli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="vendor/leaflet.css" />
    <link rel="stylesheet" href="styles.css?v=gorsel1" />
    <!-- Bölüm stilleri: her biri tek bir işin stilini taşır (çakışmasın diye ayrı dosya) -->
    <link rel="stylesheet" href="stil-senkron.css?v=2" />
    <link rel="stylesheet" href="stil-giris.css?v=2" />
    <link rel="stylesheet" href="stil-para.css?v=2" />
    <link rel="stylesheet" href="stil-stok.css?v=2" />
    <!-- Görsel yenileme: ortak + ekran stilleri (styles.css'ten sonra yüklenir, onu ezer) -->
    <link rel="stylesheet" href="stil-g-genel.css?v=2" />
    <link rel="stylesheet" href="stil-g-satis.css?v=2" />
    <link rel="stylesheet" href="stil-g-liste.css?v=2" />
  </head>
  <body>
    <div class="layout">
      <!-- Mobil çekmece örtüsü (karartma) -->
      <div class="nav-scrim" id="navScrim" aria-hidden="true"></div>
      <!-- Sidebar (JS doldurur) -->
      <aside class="sidebar">
        <div class="brand">
          <img class="b-logo" src="logo.png?v=2" alt="ÖZGÜR TİCARET" />
          <span class="b-name">Özgür Ticaret</span>
        </div>
        <ul class="menu" id="menu"></ul>
      </aside>

      <!-- Ana alan -->
      <div class="mainarea">
        <header class="topbar">
          <!-- İkonlar çizgi (app.js ikon()) — initTopbar doldurur. -->
          <button class="hamburger" id="hamburger" type="button" aria-label="Menü"></button>
          <span class="ust-ad">Özgür Ticaret</span>
          <div class="searchbox">
            <input type="text" placeholder="Müşteri, ürün ya da belge no ara" aria-label="Müşteri, ürün ya da belge no ara" />
          </div>
          <div class="topbar-right">
            <span class="t-firma">ÖZGÜR TİCARET @ U225211984</span>
            <div class="user-menu">
              <button class="t-ico bell" id="bellBtn" type="button" title="Bildirimler" aria-label="Bildirimler"><span class="bell-badge" id="bellBadge"></span></button>
              <div class="dropdown" id="bellDropdown"></div>
            </div>
            <div class="user-menu">
              <button class="user-btn" id="userBtn" type="button" aria-label="Hesap"></button>
              <div class="dropdown" id="userDropdown">
                <a data-route="profilim" data-ikon="ayar">Profilim</a>
                <a data-ikon="cikis">Çıkış Yap</a>
              </div>
            </div>
          </div>
        </header>

        <main class="content" id="content"><!-- JS render eder --></main>
      </div>
    </div>

    <script src="vendor/supabase.js"></script>
    <script src="vendor/leaflet.js"></script>
    <script src="seed.js"></script>
    <script src="app.js?v=gorsel1"></script>
  </body>
</html>
