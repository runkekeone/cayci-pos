  .bakiye.eski { display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px 26px; padding:0 0 14px; margin-bottom:16px; background:none; border-radius:0; border-left:0; border-bottom:2px solid var(--fg) }
  .bakiye.eski .etiket { font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:600; margin-bottom:3px }
  .bakiye.eski .tutar { font-family:var(--f-rakam); font-size:38px; line-height:1; font-weight:700 }

  .tablo { font-family:var(--f-rakam); font-size:15px }
  .bas, .sv > summary { display:grid; grid-template-columns:var(--kolon); column-gap:6px; align-items:center; justify-content:normal }
  .bas > *, .sv > summary > * { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0 }
  .bas { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--soluk); font-weight:600; padding:0 2px 8px; border-bottom:1px solid var(--fg) }
  .bas .r, .c-n { text-align:right }
  .sv { border-bottom:1px solid var(--cizgi) }
  .sv > summary { min-height:48px; padding:0 2px }
  .sv[open] > summary { background:var(--zemin2) }
  .c-t { font-variant-numeric:tabular-nums }
  .c-t::before { content:"›"; display:inline-block; width:.7em; color:var(--soluk); transition:transform .15s }
  .sv[open] .c-t::before { transform:rotate(90deg) }

  .sv > summary > .c-i { white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.25; font-size:14px; max-height:2.5em }
  .c-i em { color:var(--soluk); font-style:normal }
  .c-n { font-variant-numeric:tabular-nums }
  .c-n.od { color:var(--odeme) }
  .c-n.bk { font-weight:700; font-size:16px }
  .yok { color:#c3cad0 }
  .acik { background:var(--zemin2); padding:6px 8px 12px; display:grid; gap:8px }
  .detay { list-style:none; margin:0; padding:0; display:grid; gap:3px; font-size:14px }

  @media (min-width:640px) { :root { --kolon: 6.4rem minmax(10rem,1fr) 5.4rem 5.4rem 6rem } .c-t small { display:inline } .bas, .sv > summary { column-gap:12px; padding-inline:10px } }

<main id="kok"><div class="durum"><b>Açılıyor…</b></div></main>
<noscript><p style="padding:24px">Bu sayfanın çalışması için tarayıcınızda JavaScript açık olmalı.</p></noscript>
<script>
"use strict";
/* Bağlantı bilgisi panelinkiyle aynıdır (public/toptanci/app.js); testler/cari/ortak-blok.mjs ayrışmayı yakalar. */
const SB_URL = "https://zchubpqbvbhcuxclirur.supabase.co";
const SB_KEY = "sb_publishable_m5HEx3mFrjDJHBe0qfUznQ_tXkoESp3";

/* >>> CARI-ORTAK-BASLA
   Bu blok tools/babuco-cari.cjs, public/toptanci/app.js ve public/cari/index.html içinde HARFİ HARFİNE aynıdır:
   araç, panel ve müşteri sayfası aynı anahtarı türetsin, birbirinin yazdığını okusun diye. Bloğu BURADA düzenle,
   sonra kopyala:  node testler/cari/ortak-blok.mjs --yaz   (--yaz'sız çalıştırınca yalnız aynı mı diye bakar).
   Üst düzey sabit (const/let) YOK; hepsi işlev. Şifreleme WebCrypto ile (tarayıcıda da Node'da da aynı kod).

   Kurgu:
     sır   = rastgele 32 bayt; kv "babuco:cari-sir" (kilitten sonra yalnız yetkili hesap okur).
     kod   = HMAC-SHA256(sır, "kod|" + müşteri id) → 128 bit. Kişisel link kodu "#k=" kısmında taşır (sunucuya gitmez).
     hesap = AES-256-GCM(SHA-256(".../anahtar/h/" + kod)), satır adı SHA-256(".../id/h/" + kod) → "babuco:cari:h:<32 hex>".
     telefon kaydı = { k: kod }, anahtarı PBKDF2-SHA256(telefonun son 10 hanesi, sabit tuz, cariSabit().tur tur)'dan;
             satır "babuco:cari:t:<32 hex>". Telefon tahmin edilebilir bir sırdır: pahalı türetme yalnız yavaşlatır.
     o     = HMAC(sır, içerik) özeti (64 bit): yayıncı, satırı çözmeden "içerik değişti mi" diye buna bakar.
   Kayda YALNIZ cariHesap() içindeki alanlar girer. */
function cariSabit() {
  return { onek: "babuco:cari:", sirAnahtar: "babuco:cari-sir", tuz: "babuco-cari/v1/telefon", tur: 300000,
    adres: "https://runkekeone.github.io/cayci-pos/cari/" };
}
function cariKripto() { return (typeof crypto !== "undefined" && crypto.subtle) ? crypto : require("crypto").webcrypto; }
function cariBayt(metin) { return new TextEncoder().encode(String(metin)); }
function cariB64(bayt) { const b = new Uint8Array(bayt); let s = ""; for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
function cariB64url(bayt) { return cariB64(bayt).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function cariB64Coz(s) { const m = atob(String(s)), b = new Uint8Array(m.length); for (let i = 0; i < m.length; i++) b[i] = m.charCodeAt(i); return b; }
function cariHex(bayt) { return Array.from(new Uint8Array(bayt), (x) => x.toString(16).padStart(2, "0")).join(""); }
/* Telefonun son 10 hanesi ("5XXXXXXXXX"); cep numarası değilse boş. */
function cariTel10(t) { const d = String(t || "").replace(/\D/g, ""), s = d.length >= 10 ? d.slice(-10) : ""; return s[0] === "5" ? s : ""; }
async function cariHmac(sir, metin) {
  const K = cariKripto().subtle;
  const a = await K.importKey("raw", cariBayt(sir), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  return new Uint8Array(await K.sign("HMAC", a, cariBayt(metin)));
}
async function cariKod(sir, musteriId) { return cariB64url((await cariHmac(sir, "kod|" + musteriId)).slice(0, 16)); }
async function cariOzet(sir, metin) { return cariHex((await cariHmac(sir, "ozet|" + metin)).slice(0, 8)); }
/* Telefondan anahtar tohumu: pahalı kısım burası (müşterinin telefonunda bir kez, yayıncıda yalnız telefon değişince). */
async function cariTelTohum(tel10) {
  const K = cariKripto().subtle, sabit = cariSabit();
  const a = await K.importKey("raw", cariBayt(tel10), "PBKDF2", false, ["deriveBits"]);
  return cariB64url(await K.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: cariBayt(sabit.tuz), iterations: sabit.tur }, a, 256));
}
/* tur: "h" (hesap; tohum = kod) | "t" (telefon kaydı; tohum = cariTelTohum). Dönen: { key: kv satır adı, aes } */
async function cariAnahtar(tur, tohum) {
  const K = cariKripto().subtle;
  const id = cariHex(new Uint8Array(await K.digest("SHA-256", cariBayt("babuco-cari/v1/id/" + tur + "/" + tohum))).slice(0, 16));
  const ham = await K.digest("SHA-256", cariBayt("babuco-cari/v1/anahtar/" + tur + "/" + tohum));
  return { key: cariSabit().onek + tur + ":" + id, aes: await K.importKey("raw", ham, "AES-GCM", false, ["encrypt", "decrypt"]) };
}
/* Şifreli metin satır adına bağlanır (başka satıra taşınan kayıt çözülmez). Dönen: base64(iv + şifreli + etiket). */
async function cariSifrele(a, metin) {
  const C = cariKripto(), iv = C.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await C.subtle.encrypt({ name: "AES-GCM", iv: iv, additionalData: cariBayt(a.key) }, a.aes, cariBayt(metin)));
  const hepsi = new Uint8Array(12 + ct.length); hepsi.set(iv, 0); hepsi.set(ct, 12);
  return cariB64(hepsi);
}
/* Yanlış anahtar / bozuk kayıt → fırlatır. */
async function cariCoz(a, d) {
  const ham = cariB64Coz(d);
  const pt = await cariKripto().subtle.decrypt({ name: "AES-GCM", iv: ham.slice(0, 12), additionalData: cariBayt(a.key) }, a.aes, ham.slice(12));
  return new TextDecoder().decode(pt);
}
/* Müşterinin göreceği hesap. YALNIZ burada sayılan alanlar kayda girer: firma adı, müşteri adı, açılış bakiyesi,
   bakiye, fişler (no, tarih, kalem adı/adet/satış fiyatı, iskonto, toplam, nakit/kart/açık) ve ödemeler (tarih,
   tutar, tür). Alış fiyatı, maliyet, kâr, komisyon, limit, vade, telefon, not metinleri, müşteri/ürün kimlikleri
   ve başka müşteriler GİRMEZ. turBul = tahsilatTuru (ödemenin türü: nakit|kart|havale|iade|duzeltme). */
function cariHesap(S, c, turBul) {
  const N = (v) => Math.round((Number(v) || 0) * 100) / 100;
  const sirala = (a, b) => (String(a.t) < String(b.t) ? -1 : String(a.t) > String(b.t) ? 1 : 0);
  const st = S.settings || {};
  let bakiye = N(c.acilis);
  const f = (S.sales || []).filter((s) => s && s.musteriId === c.id).map((s) => {
    const o = s.odeme || {};
    const x = { no: String(s.belgeNo || ""), t: String(s.tarih || ""), top: N(s.toplam), nakit: N(o.nakit), kart: N(o.pos), acik: N(o.acik),
      k: (s.items || []).map((it) => [String(it.ad || ""), Number(it.adet) || 0, N(it.fiyat)]) };
    if (N(s.iskonto)) x.isk = N(s.iskonto);
    if (s.odemeAdi === "İade" || x.top < 0) x.iade = 1;
    else if (s.odemeAdi === "Havale") x.havale = 1;
    bakiye += x.acik;
    return x;
  }).sort(sirala);
  const o = (S.payments || []).filter((p) => p && p.musteriId === c.id).map((p) => {
    const x = { t: String(p.tarih || ""), tutar: N(p.tutar), tur: String(turBul(p)) };
    /* "Satış üstü fazla ödeme → borca sayıldı (Belge X)": yalnız belge numarası alınır; not metni kayda girmez. */
    const m = /fazla ödeme/i.test(String(p.not || "")) ? /Belge (\d{4}-\d+)/.exec(String(p.not)) : null;
    if (m) x.fis = m[1];
    bakiye -= x.tutar;
    return x;
  }).sort(sirala);
  return { v: 1, firma: String(st.fisBaslik || st.firmaAdi || ""), ad: String(c.ad || ""), acilis: N(c.acilis), bakiye: N(bakiye), f: f, o: o };
}
/* Yayın planı: buluttaki satırlarla (mevcut: [{ key, o }]) karşılaştırır; yalnız içeriği değişeni yazar, artık
   karşılığı olmayanı (silinen müşteri, değişen/silinen telefon, değişen sır) siler. Buluta dokunmaz.
   Dönen: { yaz: [{ key, value }], sil: [key], atlanan: [{ ad, neden }], musteri } */
async function cariPlan(S, sir, mevcut, turBul) {
  const sabit = cariSabit(), var_ = {}, telKaydi = {}, kalsin = {}, yaz = [], atlanan = [], telGoren = {};
  (mevcut || []).forEach((r) => { if (r && String(r.key).indexOf(sabit.onek) === 0) var_[r.key] = typeof r.o === "string" ? r.o : ""; });
  Object.keys(var_).forEach((k) => { if (k.indexOf(sabit.onek + "t:") === 0 && var_[k]) telKaydi[var_[k]] = k; });
  let musteri = 0;
  for (const c of (S.customers || [])) {
    if (!c || !c.id) continue;
    musteri++;
    const kod = await cariKod(sir, c.id), a = await cariAnahtar("h", kod);
    const metin = JSON.stringify(cariHesap(S, c, turBul)), o = await cariOzet(sir, "h|" + kod + "|" + metin);
    kalsin[a.key] = 1;
    if (var_[a.key] !== o) yaz.push({ key: a.key, value: { v: 1, o: o, d: await cariSifrele(a, metin) } });
    const tel = cariTel10(c.telefon);
    if (!tel) { atlanan.push({ ad: c.ad, neden: "cep telefonu kayıtlı değil" }); continue; }
    if (telGoren[tel]) { atlanan.push({ ad: c.ad, neden: "numarası \"" + telGoren[tel] + "\" ile aynı" }); continue; }
    telGoren[tel] = c.ad;
    const ot = await cariOzet(sir, "t|" + tel + "|" + kod);

const pad2 = (n) => String(n).padStart(2, "0");

function customerBorc(store, id) {

const KART_NOT_RE = /(^|[^a-zçğöşü])(pos|kart)(['’]?(la|tan|dan|ina|indan|iyla|i|a))?(?![a-zçğöşü])/;
const HAVALE_NOT_RE = /(^|[^a-zçğöşü])(havale[a-zçğöşü]*|eft(['’][a-zçğöşü]+)?|iban(['’]?[a-zçğöşü]{1,4})?)(?![a-zçğöşü])/;

  if (/d[üu]zeltme/.test(n) || Number(p && p.tutar) < 0) return "duzeltme";

const VADE_VARSAYILAN = 30;
function genelVade(store) { const v = Number(store.settings && store.settings.varsayilanVade); return v > 0 ? Math.round(v) : VADE_VARSAYILAN; }
function musteriVade(store, c) { const v = Number(c && c.vade); return v > 0 ? Math.round(v) : genelVade(store); }
function gunFarki(iso, bugun) {
  const a = new Date(localDateStr(new Date(iso)) + "T12:00:00"), b = new Date((bugun || todayStr()) + "T12:00:00");
  return Math.round((b - a) / 86400000);

function idZamani(id) {
  const m = /^id\d+([0-9a-z]{8})$/.exec(String(id || "")); if (!m) return null;
  const t = parseInt(m[1], 36);

function borcYas(store, id, bugun) {
  const c = store.customers.find((x) => x.id === id); if (!c) return null;
  const N = (v) => Number(v) || 0, borclar = [];
  let odenen = 0, ilk = null;
  const gor = (t) => { if (t && (!ilk || t < ilk)) ilk = t; };
  store.sales.forEach((s) => {
    if (s.musteriId !== id) return; gor(s.tarih);
    const a = N(s.odeme && s.odeme.acik);
    if (a > 0) borclar.push({ t: s.tarih, tutar: a, belge: s.belgeNo }); else if (a < 0) odenen += -a;
  });
  store.payments.forEach((p) => {
    if (p.musteriId !== id) return; gor(p.tarih);
    const t = N(p.tutar);
    if (t > 0) odenen += t; else if (t < 0) borclar.push({ t: p.tarih, tutar: -t, belge: "elle yazılan borç" });
  });
  const ac = N(c.acilis);
  if (ac > 0) {
    const kart = idZamani(c.id);
    let t = ilk && kart ? (kart < ilk ? kart : ilk) : (ilk || kart);
    if (!t) t = store.sales.reduce((m, s) => (!m || s.tarih < m ? s.tarih : m), null) || new Date().toISOString();
    borclar.push({ t: t, tutar: ac, belge: "açılış borcu", acilis: true });
  } else if (ac < 0) odenen += -ac;
  borclar.sort((a, b) => (a.acilis ? -1 : b.acilis ? 1 : (a.t < b.t ? -1 : a.t > b.t ? 1 : 0)));
  odenen = kurus(odenen);
  const acik = [];
  borclar.forEach((b) => {
    const kapanan = Math.min(b.tutar, odenen); odenen = kurus(odenen - kapanan);
    const kalan = kurus(b.tutar - kapanan);
    if (kalan > 0.005) acik.push({ t: b.t, tutar: kalan, belge: b.belge, gun: Math.max(0, gunFarki(b.t, bugun)) });
  });
  const vade = musteriVade(store, c), gec = acik.filter((a) => a.gun > vade);
  const gecikmisTutar = kurus(gec.reduce((a, x) => a + x.tutar, 0));
  const gecikmis = gecikmisTutar > 0.5;
  return { borc: kurus(acik.reduce((a, x) => a + x.tutar, 0) - odenen), acik: acik, avans: odenen, vade: vade, vadeOzel: Number(c.vade) > 0,
    enEski: acik[0] || null, gecikmis: gecikmis, gecikmisTutar: gecikmis ? gecikmisTutar : 0, gecikmeGun: gecikmis ? acik[0].gun - vade : 0 };
}

/** Tek kv satırı: { value, updated_at } | null (yok). Ağ hatasında { ag: true }, 401/403'te { yetki: true } fırlatır. */
async function kvOku(key, jeton) {
  let r;
  try {
    r = await fetch(SB_URL + "/rest/v1/kv?key=eq." + encodeURIComponent(key) + "&select=value,updated_at",
      { headers: { apikey: SB_KEY, Authorization: "Bearer " + (jeton || SB_KEY) }, cache: "no-store" });
  } catch (e) { throw { ag: true }; }
  if (r.status === 401 || r.status === 403) throw { yetki: true };
  if (!r.ok) throw { ag: true };
  const j = await r.json().catch(() => null);
  return Array.isArray(j) && j[0] ? j[0] : null;
}

/* Hesap görünümü: eski sayfadaki gibi — servis günü başına TEK SATIR (tarih · içerik · tutar · ödenen · bakiye),

  } catch (e) { agHatasiCiz(() => kodlaAc(kod, linkten)); }
}
/* Sayfaya geri dönülünce (sekme yeniden görünür olunca) hesabı sessizce tazele: müşteri hep o anki hâli görsün. */
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || !acikKod || Date.now() - sonOkuma < 15000) return;
  const kod = acikKod;
  try { const s = await hesapGetir(kod); if (s.durum === "var" && acikKod === kod) hesapCiz(s.hesap, s.guncel, kod); } catch (e) {}
});

/* ---------- patron: toptancının salt-okunur görünümü (panelle aynı hesap; hiçbir şey yazmaz) ---------- */
const OTURUM = "babuco:oturum";          // panelin oturum kaydı (aynı site): varsa yeniden sorulmaz
let P = null;                            // { store, sir, secili }
function oturumOku() { try { const o = JSON.parse(localStorage.getItem(OTURUM) || "null"); return o && o.access_token ? o : null; } catch (e) { return null; } }
function oturumYaz(o) { try { localStorage.setItem(OTURUM, JSON.stringify(o)); } catch (e) {} }
/** → oturum | null (kimlik reddedildi). Ağ hatasında { ag: true } fırlatır. */
async function jetonIste(tur, govde) {
  let r;
  try { r = await fetch(SB_URL + "/auth/v1/token?grant_type=" + tur, { method: "POST", headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify(govde) }); }
  catch (e) { throw { ag: true }; }
  if (r.status === 429) throw { cok: true };
  if (r.status >= 400 && r.status < 500) return null;
  if (!r.ok) throw { ag: true };
  const j = await r.json().catch(() => null);
  if (!j || !j.access_token) return null;
  if (!j.expires_at) j.expires_at = Math.floor(Date.now() / 1000) + (Number(j.expires_in) || 3600);
  return j;
}
async function oturumYenile(o) {
  if (!o || !o.refresh_token) return null;
  const y = await jetonIste("refresh_token", { refresh_token: o.refresh_token });
  if (!y) return null;
  if (!y.user) y.user = o.user;
  oturumYaz(y);                          // panel de aynı kaydı kullanır: yenilenen jeton ona da geçsin
  return y;
}
/** → { store, sir } | { red: true } (bu hesap veriyi göremiyor) | { suresi: true } (jeton reddedildi) */
async function patronVeri(o) {
  const oku = async (key) => {
    let s = await kvOku(key, o.access_token);
    if (!s) s = await kvOku(key).catch(() => null);      // kilit kurulmadan önceki "yalnız oturumsuz okur" düzeni
    return s;
  };
  let satir;
  try { satir = await oku("babuco:store"); } catch (e) { if (e && e.yetki) return { suresi: true }; throw e; }
  if (!satir || !satir.value || !Array.isArray(satir.value.customers)) return { red: true };
  let sir = null;
  try { const s = await oku(cariSabit().sirAnahtar); sir = (s && s.value && s.value.sir) || null; } catch (e) {}
  return { store: satir.value, sir: sir };
}
function patronGirisCiz(mesaj) {
  P = null;
  kok.innerHTML = `<section class="giris" id="patronGiris">
      <div class="firma">Özgür Ticaret</div>
      <h1>Toptancı girişi</h1>
      <p>Müşteri hesaplarını görmek için panelde kullandığın e-posta ve şifreyle gir.</p>
      <form id="pForm" novalidate>
        <div style="display:grid;gap:10px">
          <label for="pEposta">E-posta</label>
          <input id="pEposta" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" style="font-size:18px">
          <label for="pSifre">Şifre</label>
          <input id="pSifre" type="password" autocomplete="current-password" style="font-size:18px">
          <button class="ana-btn" id="pGir" type="submit">Giriş yap</button>
          <p class="hata" id="hata" role="alert">${esc(mesaj || "")}</p>
        </div>
      </form>
      <p class="alt-link"><a href="#" id="musteriLink">Müşteri girişi</a></p>
    </section>`;
  document.getElementById("pForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const eposta = document.getElementById("pEposta").value.trim(), sifre = document.getElementById("pSifre").value;
    const hata = document.getElementById("hata"), btn = document.getElementById("pGir");
    if (!eposta || !sifre) { hata.textContent = "E-posta ve şifreni yaz."; return; }
    hata.textContent = ""; btn.disabled = true; btn.textContent = "Giriş yapılıyor…";
    try {
      const o = await jetonIste("password", { email: eposta, password: sifre });
      if (!o) hata.textContent = "E-posta ya da şifre yanlış.";
      else {
        const v = await patronVeri(o);
        if (v.store) { oturumYaz(o); return patronBasla(v); }
        hata.textContent = "Bu hesabın müşteri hesaplarını görme izni yok.";
      }
    } catch (x) { hata.textContent = x && x.cok ? "Çok fazla deneme yapıldı. Birkaç dakika bekleyip tekrar dene." : "Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene."; }
    btn.disabled = false; btn.textContent = "Giriş yap";
  });
}
async function patronAc() {
  durumCiz("Hesaplar açılıyor…");
  try {
    let o = oturumOku();
    if (o && (Number(o.expires_at) || 0) - 60 < Date.now() / 1000) o = await oturumYenile(o);
    if (!o) return patronGirisCiz("");
    let v = await patronVeri(o);
    if (v.suresi) { o = await oturumYenile(o); if (!o) return patronGirisCiz("Oturumun kapanmış. Yeniden giriş yap."); v = await patronVeri(o); }
    if (!v.store) return patronGirisCiz("Bu hesabın müşteri hesaplarını görme izni yok.");
    patronBasla(v);
  } catch (e) { agHatasiCiz(patronAc); }
}
function patronBasla(v) {
  P = { store: v.store, sir: v.sir, ara: "" };
  const m = hashOku().m;
  if (m && P.store.customers.some((c) => c.id === m)) patronMusteriCiz(m); else patronListeCiz();
}
function patronListeCiz() {
  const S = P.store, bugun = todayStr();
  const satirlar = S.customers.map((c) => {
    const borc = customerBorc(S, c.id), y = borcYas(S, c.id, bugun), lim = musteriLimit(c), isaret = [];
    if (y && y.gecikmis) isaret.push(y.gecikmeGun + " gündür gecikmiş");
    if (lim && borc > lim + 0.005) isaret.push("limit aşıldı");
    return { c: c, borc: borc, isaret: isaret.join(" · ") };
  }).sort((a, b) => b.borc - a.borc || String(a.c.ad).localeCompare(String(b.c.ad), "tr"));
  const alacak = kurus(satirlar.reduce((a, x) => a + Math.max(0, x.borc), 0)), borclu = satirlar.filter((x) => x.borc > 0.005).length;
  kok.innerHTML = `<div class="ust"><div><div class="firma">${esc(S.settings && (S.settings.fisBaslik || S.settings.firmaAdi) || "Özgür Ticaret")}</div><h1>Müşteri hesapları</h1></div></div>
    <section class="bakiye" aria-label="Toplam alacak"><span class="etiket">Toplam alacak</span><b class="tutar" id="toplamAlacak">${para.format(alacak)}</b><span class="son">${borclu} müşteri borçlu · ${satirlar.length} müşteri</span></section>
    <input class="ara" id="ara" type="search" placeholder="Müşteri ara" aria-label="Müşteri ara" value="${esc(P.ara)}">
    <div class="liste" id="liste"></div>`;
  const liste = document.getElementById("liste");
  const ciz = () => {
    const a = P.ara.toLocaleLowerCase("tr-TR").trim();
    const g = satirlar.filter((x) => !a || String(x.c.ad).toLocaleLowerCase("tr-TR").indexOf(a) >= 0);
    liste.innerHTML = g.map((x) => `<button class="musteri" type="button" data-id="${esc(x.c.id)}"><span class="m-ad">${esc(x.c.ad)}${x.isaret ? `<small>${esc(x.isaret)}</small>` : ""}</span><b class="${Math.abs(x.borc) < 0.005 ? "sifir" : ""}">${para.format(x.borc)}</b></button>`).join("") || `<div class="bos" style="border:0">Eşleşen müşteri yok.</div>`;
  };
  ciz();
  document.getElementById("ara").addEventListener("input", (e) => { P.ara = e.target.value; ciz(); });
  liste.addEventListener("click", (e) => { const b = e.target.closest("[data-id]"); if (b) { patronMusteriCiz(b.dataset.id); window.scrollTo(0, 0); } });
}
async function patronMusteriCiz(id) {
  const S = P.store, c = S.customers.find((x) => x.id === id); if (!c) return patronListeCiz();
  const h = cariHesap(S, c, tahsilatTuru);          // müşterinin sayfasına yayınlanan içeriğin AYNISI
  const link = P.sir ? await cariLink(P.sir, c.id) : "";
  const firma = (S.settings && (S.settings.fisBaslik || S.settings.firmaAdi)) || "";
  const telVar = !!String(c.telefon || "").replace(/\D/g, "");
  kok.innerHTML = baslikHTML(h, `<button class="kucuk-btn" id="geri" type="button">‹ Müşteriler</button>`) +
    (link ? `<div class="eylem">
        <a class="ana-btn yesil" id="waGonder" href="${esc(cariWa(c, firma, link))}" target="_blank" rel="noopener">Linkini gönder (WhatsApp)</a>
        <button class="ana-btn ikinci" id="kopyala" type="button">Linki kopyala</button>
        ${telVar ? "" : `<p class="not" style="margin:0">Telefonu kayıtlı değil: WhatsApp açılınca kişiyi kendin seç.</p>`}
      </div>`
      : `<p class="not" style="margin:0 0 16px">Kişisel link henüz hazır değil: cari sayfa bir kez yayınlanınca burada çıkar.</p>`) +
    hesapHTML(h, "", []);
  document.getElementById("geri").addEventListener("click", () => { patronListeCiz(); });
  const k = document.getElementById("kopyala");
  if (k) k.addEventListener("click", async () => {
    let tamam = false;
    try { await navigator.clipboard.writeText(link); tamam = true; } catch (e) {}
    if (!tamam) { const i = document.createElement("input"); i.value = link; document.body.appendChild(i); i.select(); try { tamam = document.execCommand("copy"); } catch (e) {} i.remove(); }
    k.textContent = tamam ? "Kopyalandı ✓" : "Kopyalanamadı";
    setTimeout(() => { k.textContent = "Linki kopyala"; }, 2500);
  });
}

/* ---------- açılış ---------- */
function hashOku() {
  const o = {};
  location.hash.replace(/^#/, "").split("&").forEach((p) => { if (!p) return; const i = p.indexOf("="); o[i < 0 ? p : p.slice(0, i)] = i < 0 ? "1" : decodeURIComponent(p.slice(i + 1)); });
  return o;
}
function basla() {
  if (!window.crypto || !crypto.subtle) return durumCiz("Bu tarayıcıda açılamıyor", "Lütfen telefonunuzun güncel tarayıcısıyla (Chrome ya da Safari) açın.");
  const h = hashOku();
  if (h.patron) return patronAc();
  if (h.k) return kodlaAc(h.k, true);
  const sakli = sakliOku();
  if (sakli) return kodlaAc(sakli, false);
  girisCiz("");
}
window.addEventListener("hashchange", basla);
basla();
